name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious failure reports in seconds.
      - name: Format check
        run: npm run format:check

      # Next.js 16 no longer runs ESLint during `next build`, so this step is
      # the ONLY place lint and the architectural boundary rules are enforced.
      # Do not remove it. See docs/architecture/overview.md.
      - name: Lint and architectural boundaries
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

      # Chromium and WebKit only. WebKit is not optional — the iPhone is the
      # primary target and Safari is where Atlas actually has to work.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end, responsive, and accessibility checks
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
